[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corium-sim"
version = "0.2.0"
description = "High-Performance 3D Agent Simulation & WebGPU Engine"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Simone Cavalleri", email = "simone.cavalleri.94@gmail.com"}
]
keywords = ["reinforcement-learning", "robotics", "simulation", "webgpu", "gymnasium", "3d"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++"
]

[project.scripts]
corium-sim = "corium_sim.cli:main"
